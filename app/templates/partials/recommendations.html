<div class="recommend-section">
  <div class="recommend-header">
    <div>
      <h2 class="recommend-title">Recommended For You</h2>
      <p class="recommend-subtitle">Smart picks based on your watch habits, favorites, and the current time</p>
    </div>
  </div>
  <div class="recommend-reel" id="recommend-reel">
    {% for image in recommendations %}
      <div class="recommend-card">
        <img src="/api/photos/{{ image.id }}/thumbnail" alt="{{ image.filename }}" loading="lazy" @click="openModal({{ image.id }})">
        {% if image.is_video %}
          <div class="video-play-indicator" @click="openModal({{ image.id }})">
            <div class="video-play-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"/>
              </svg>
            </div>
          </div>
        {% endif %}
        <div class="recommend-card-meta">
          <span class="card-info" title="{{ image.filename }}">{{ image.filename }}</span>
          <span class="video-badge-label">{% if image.formatted_duration %}{{ image.formatted_duration }}{% endif %}</span>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
