<div class="target-picker-card" style="max-width: 580px; width: 95%; max-height: 85vh; display: flex; flex-direction: column;" @click.stop x-data="{
  selectedFolder: '{{ folders[0] if folders else '' }}',
  customFolder: '',
  folderSearch: '',
  isCreatingNew: false,
  isProcessing: false,
  folders: {{ folders|tojson|forceescape }},
  get filteredFolders() {
    if (!this.folderSearch.trim()) return this.folders;
    const term = this.folderSearch.toLowerCase().trim();
    return this.folders.filter(f => f.toLowerCase().includes(term));
  },
  get targetFolder() {
    return this.isCreatingNew && this.customFolder.trim() ? this.customFolder.trim() : this.selectedFolder;
  },
  async submitAction() {
    const folder = this.targetFolder;
    if (!folder) {
      alert('Please select or specify a destination folder.');
      return;
    }
    const ids = '{{ image_ids }}'.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
    if (!ids.length) {
      alert('No items selected.');
      return;
    }
    this.isProcessing = true;
    const endpoint = '{{ action }}' === 'copy' ? '/api/files/copy' : '/api/files/move';
    try {
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image_ids: ids,
          destination_folder: folder
        })
      });
      const data = await resp.json();
      if (resp.ok) {
        window.closePicker();
        if (window.bulkSelection) {
          window.bulkSelection.clear();
        }
        window.location.reload();
      } else {
        alert(data.detail || 'Failed to complete operation.');
      }
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      this.isProcessing = false;
    }
  }
}">
  <div class="target-picker-header" style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between;">
    <div>
      <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        {% if action == 'copy' %}Copy{% else %}Move{% endif %} to Destination Folder
      </h3>
      <p style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.2rem;">
        Select target folder for selected media items.
      </p>
    </div>
    <button type="button" class="modal-close" @click="window.closePicker()" style="background: none; border: none; color: var(--text-dim); cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-subtle); display: flex; gap: 0.75rem; align-items: center;">
    <div style="position: relative; flex: 1;">
      <input 
        type="text" 
        x-model="folderSearch" 
        placeholder="Search existing folders..." 
        class="search-input" 
        style="width: 100%; padding-left: 2rem;"
      >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
    </div>
    <button 
      type="button" 
      class="btn" 
      :class="{ 'btn-primary': isCreatingNew }"
      @click="isCreatingNew = !isCreatingNew"
      style="white-space: nowrap; font-size: 0.8125rem;"
    >
      <span x-text="isCreatingNew ? 'Choose Existing' : '+ New Folder'"></span>
    </button>
  </div>

  <!-- New Custom Folder Input -->
  <div x-show="isCreatingNew" style="padding: 0.75rem 1.5rem; background: rgba(99, 102, 241, 0.08); border-bottom: 1px solid rgba(99, 102, 241, 0.2);">
    <label style="display: block; font-size: 0.75rem; font-weight: 600; color: #a5b4fc; margin-bottom: 0.35rem;">
      Full Destination Path or Subfolder:
    </label>
    <input 
      type="text" 
      x-model="customFolder" 
      placeholder="/path/to/folder or subfolder name" 
      class="inline-edit-input" 
      style="width: 100%; font-size: 0.875rem;"
    >
  </div>

  <!-- Folder List -->
  <div style="flex: 1; overflow-y: auto; padding: 0.75rem 1.5rem; max-height: 320px; display: flex; flex-direction: column; gap: 0.4rem;">
    <template x-for="folder in filteredFolders" :key="folder">
      <div 
        @click="selectedFolder = folder; isCreatingNew = false;"
        :class="{ 'selected-folder-item': selectedFolder === folder && !isCreatingNew }"
        class="folder-select-row"
        style="padding: 0.65rem 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: var(--transition);"
      >
        <div style="display: flex; align-items: center; gap: 0.6rem; min-width: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: #6366f1; flex-shrink: 0;">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span style="font-size: 0.875rem; color: var(--text-main); font-weight: 500; word-break: break-all;" x-text="folder"></span>
        </div>
        <div x-show="selectedFolder === folder && !isCreatingNew" style="color: #10b981; font-size: 0.875rem; font-weight: 700;">
          ✓
        </div>
      </div>
    </template>
    <div x-show="filteredFolders.length === 0" style="padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.875rem;">
      No matching folders. Use "+ New Folder" to specify a path.
    </div>
  </div>

  <!-- Actions Footer -->
  <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.4);">
    <div style="font-size: 0.8125rem; color: var(--text-muted); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
      Target: <span style="color: #a5b4fc; font-weight: 600;" x-text="targetFolder || '(none)'"></span>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button type="button" class="btn" @click="window.closePicker()" :disabled="isProcessing">Cancel</button>
      <button 
        type="button" 
        class="btn btn-primary" 
        @click="submitAction()" 
        :disabled="isProcessing || !targetFolder"
        style="display: inline-flex; align-items: center; gap: 0.4rem;"
      >
        <span x-show="!isProcessing">Confirm {% if action == 'copy' %}Copy{% else %}Move{% endif %}</span>
        <span x-show="isProcessing">Processing...</span>
      </button>
    </div>
  </div>
</div>
