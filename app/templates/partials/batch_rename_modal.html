<div class="target-picker-card" style="max-width: 540px; width: 95%; max-height: 85vh; display: flex; flex-direction: column;" @click.stop x-data="{
  mode: 'prefix',
  prefix: '',
  suffix: '',
  findText: '',
  replaceText: '',
  pattern: 'Photo_{n}',
  startIndex: 1,
  isProcessing: false,
  ids: '{{ image_ids }}'.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n)),
  async submitRename() {
    if (!this.ids.length) return;
    this.isProcessing = true;
    try {
      const resp = await fetch('/api/files/batch-rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image_ids: this.ids,
          mode: this.mode,
          prefix: this.prefix,
          suffix: this.suffix,
          find_text: this.findText,
          replace_text: this.replaceText,
          pattern: this.pattern,
          start_index: parseInt(this.startIndex) || 1
        })
      });
      const data = await resp.json();
      if (resp.ok) {
        window.closePicker();
        if (window.bulkSelection) window.bulkSelection.clear();
        window.location.reload();
      } else {
        alert(data.detail || 'Rename failed');
      }
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      this.isProcessing = false;
    }
  }
}">
  <div class="target-picker-header" style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between;">
    <div>
      <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        Batch Rename <span style="color: #a5b4fc;" x-text="ids.length + ' item' + (ids.length !== 1 ? 's' : '')"></span>
      </h3>
      <p style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.2rem;">
        Choose renaming pattern or text transformation.
      </p>
    </div>
    <button type="button" class="modal-close" @click="window.closePicker()" style="background: none; border: none; color: var(--text-dim); cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div style="padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto;">
    <!-- Mode Selection Pills -->
    <div style="display: flex; gap: 0.4rem; background: rgba(15, 23, 42, 0.6); padding: 0.3rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
      <button 
        type="button" 
        class="filter-pill" 
        :class="{ 'active': mode === 'prefix' }" 
        @click="mode = 'prefix'"
        style="flex: 1; text-align: center; justify-content: center; font-size: 0.8125rem; padding: 0.35rem 0.6rem;"
      >
        Prefix
      </button>
      <button 
        type="button" 
        class="filter-pill" 
        :class="{ 'active': mode === 'suffix' }" 
        @click="mode = 'suffix'"
        style="flex: 1; text-align: center; justify-content: center; font-size: 0.8125rem; padding: 0.35rem 0.6rem;"
      >
        Suffix
      </button>
      <button 
        type="button" 
        class="filter-pill" 
        :class="{ 'active': mode === 'replace' }" 
        @click="mode = 'replace'"
        style="flex: 1; text-align: center; justify-content: center; font-size: 0.8125rem; padding: 0.35rem 0.6rem;"
      >
        Replace
      </button>
      <button 
        type="button" 
        class="filter-pill" 
        :class="{ 'active': mode === 'pattern' }" 
        @click="mode = 'pattern'"
        style="flex: 1; text-align: center; justify-content: center; font-size: 0.8125rem; padding: 0.35rem 0.6rem;"
      >
        Sequence {n}
      </button>
    </div>

    <!-- Mode Form Fields -->
    <template x-if="mode === 'prefix'">
      <div>
        <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Prefix to prepend:</label>
        <input type="text" x-model="prefix" placeholder="e.g. 2026_Summer_" class="inline-edit-input" style="width: 100%; font-size: 0.875rem;">
      </div>
    </template>

    <template x-if="mode === 'suffix'">
      <div>
        <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Suffix to append:</label>
        <input type="text" x-model="suffix" placeholder="e.g. _edited" class="inline-edit-input" style="width: 100%; font-size: 0.875rem;">
      </div>
    </template>

    <template x-if="mode === 'replace'">
      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Find text in filename:</label>
          <input type="text" x-model="findText" placeholder="e.g. IMG_" class="inline-edit-input" style="width: 100%; font-size: 0.875rem;">
        </div>
        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Replace with:</label>
          <input type="text" x-model="replaceText" placeholder="e.g. Holiday_" class="inline-edit-input" style="width: 100%; font-size: 0.875rem;">
        </div>
      </div>
    </template>

    <template x-if="mode === 'pattern'">
      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Pattern (use {n} for number):</label>
          <input type="text" x-model="pattern" placeholder="e.g. Trip_{n}" class="inline-edit-input" style="width: 100%; font-size: 0.875rem;">
        </div>
        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Start Number:</label>
          <input type="number" x-model="startIndex" min="1" class="inline-edit-input" style="width: 120px; font-size: 0.875rem;">
        </div>
      </div>
    </template>
  </div>

  <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; background: rgba(15, 23, 42, 0.4);">
    <button type="button" class="btn" @click="window.closePicker()" :disabled="isProcessing">Cancel</button>
    <button 
      type="button" 
      class="btn btn-primary" 
      @click="submitRename()" 
      :disabled="isProcessing"
      style="display: inline-flex; align-items: center; gap: 0.4rem;"
    >
      <span x-show="!isProcessing">Apply Rename</span>
      <span x-show="isProcessing">Renaming...</span>
    </button>
  </div>
</div>
