<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kimera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#334155" stroke-width="5"/>
  <rect x="30" y="30" width="452" height="452" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Soft glow behind subject -->
  <circle cx="256" cy="242" r="185" fill="url(#glow)"/>

  <!-- Face detection window brackets -->
  <g stroke="#34d399" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M190 138 H150 V178"/>
    <path d="M322 138 H362 V178"/>
    <path d="M190 346 H150 V306"/>
    <path d="M322 346 H362 V306"/>
  </g>

  <!-- Stylized face -->
  <circle cx="256" cy="242" r="86" fill="url(#brand)"/>
  <circle cx="228" cy="230" r="9" fill="#0f172a"/>
  <circle cx="284" cy="230" r="9" fill="#0f172a"/>
  <path d="M228 278 Q256 304 284 278" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round"/>

  <!-- Favorites sparkle -->
  <path d="M398 364 C403 386 422 405 444 410 C422 415 403 434 398 456 C393 434 374 415 352 410 C374 405 393 386 398 364 Z" fill="#f59e0b"/>
</svg>